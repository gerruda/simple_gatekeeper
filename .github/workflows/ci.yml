name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Сборка, go vet и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Собрать проект
        run: go build ./...

      - name: Проверить go vet
        run: go vet ./...

      - name: Запустить тесты с -race
        run: go test -race -count=1 ./internal/...
